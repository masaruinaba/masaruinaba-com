            <div class="gather-character gather-round"><img data-src="/special/balloon-portfolio/opening/round.png" alt="" width="1600" height="1600" decoding="async"></div>
            <div class="gather-character gather-flower"><img data-src="/special/balloon-portfolio/opening/flower.png" alt="" width="1600" height="1600" decoding="async"></div>
            <div class="gather-character gather-star"><img data-src="/special/balloon-portfolio/opening/star.png" alt="" width="1600" height="1600" decoding="async"></div>
            <div class="gather-character gather-blue"><img data-src="/special/balloon-portfolio/opening/blue.png" alt="" width="1600" height="1600" decoding="async"></div>
            <div class="gather-character gather-coil"><img data-src="/special/balloon-portfolio/opening/coil.png" alt="" width="1600" height="1600" decoding="async"></div>
            <a class="gather-link" href="/special/balloon-portfolio/" aria-label="Explore Playground"><span class="gather-wordmark" aria-hidden="true"><i class="gather-logo-base"></i><i class="gather-logo-o"></i><i class="gather-logo-u"></i></span><span class="gather-link-cue" aria-hidden="true"><span class="gather-link-label"><span>Explore</span><span>Let’s play</span></span><span>（↗）</span></span><span class="gather-hover-icon" data-balloon-icon aria-hidden="true"></span></a>

    <script type="module">
      import { LiquidHover } from '/src/prototype/liquid-hover.ts'
      import { clientWorks, works } from '/src/data/portfolio.ts'

      let liquid = null

      const shuffleChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?/\\\\[]{}*&^%$#@'

      function randomShuffleChar(char) {
        if (/\s/.test(char)) return char
        return shuffleChars.charAt(Math.floor(Math.random() * shuffleChars.length))
      }

      function shuffleArray(items) {
        const shuffled = [...items]
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]
        }
        return shuffled
      }

      function animateTextShuffle(element) {
        element = element.querySelector('.row-entry-text') || element
        const originalText = element.dataset.originalTitle || element.textContent
        const characters = Array.from(originalText)
        const revealOrder = shuffleArray(characters.map((_, index) => index))
        const revealStepByIndex = new Map(revealOrder.map((index, step) => [index, step]))
        const token = Symbol('text-shuffle')
        const randomFrames = Math.max(8, Math.floor(characters.length * 0.8))
        let frame = 0

        element.dataset.originalTitle = originalText
        element._shuffleToken = token
        clearTimeout(element._shuffleTimer)

        const tick = () => {
          if (element._shuffleToken !== token) return

          const revealCount = Math.max(0, frame - randomFrames)
          element.textContent = characters.map((char, index) => {
            if (revealStepByIndex.get(index) < revealCount) return char
            return randomShuffleChar(char)
          }).join('')

          frame++

          if (revealCount <= characters.length) {
            element._shuffleTimer = setTimeout(tick, 1000 / 28)
          } else {
            element.textContent = originalText
            element._shuffleToken = null
          }
        }

        tick()
      }

      function resetTextShuffle(element) {
        element = element.querySelector('.row-entry-text') || element
        clearTimeout(element._shuffleTimer)
        element._shuffleToken = null
        if (element.dataset.originalTitle) element.textContent = element.dataset.originalTitle
      }

      function colorDot(color) {
        const canvas = document.createElement('canvas')
        canvas.width = 8
        canvas.height = 8
        const ctx = canvas.getContext('2d')
        ctx.fillStyle = color
        ctx.fillRect(0, 0, 8, 8)
        return canvas.toDataURL()
      }

      function isLightColor(color) {
        if (color.startsWith('rgb')) {
          const matches = color.match(/\d+/g)
          if (matches && matches.length >= 3) {
            const r = parseInt(matches[0])
            const g = parseInt(matches[1])
            const b = parseInt(matches[2])
            return (r * 299 + g * 587 + b * 114) / 1000 > 180
          }
        }

        const hex = color.replace('#', '')
        const full = hex.length === 3 ? hex.split('').map((c) => c + c).join('') : hex
        const r = parseInt(full.slice(0, 2), 16)
        const g = parseInt(full.slice(2, 4), 16)
        const b = parseInt(full.slice(4, 6), 16)
        return (r * 299 + g * 587 + b * 114) / 1000 > 180
      }

      function adjustColorForHover(color) {
        if (!isLightColor(color)) return color

        const hex = color.replace('#', '')
        const full = hex.length === 3 ? hex.split('').map((c) => c + c).join('') : hex
        const r = parseInt(full.slice(0, 2), 16)
        const g = parseInt(full.slice(2, 4), 16)
        const b = parseInt(full.slice(4, 6), 16)
        return `rgb(${Math.max(0, Math.floor(r * 0.6))}, ${Math.max(0, Math.floor(g * 0.6))}, ${Math.max(0, Math.floor(b * 0.6))})`
      }

      function itemHref(work) {
        const href = work.url || work.file || '#'
        if (href === '#' || href.startsWith('http') || href.startsWith('/')) return href
        return `/${href}`
      }

      function itemLabel(work) {
        const href = work.url || work.file || '#'
        return work.displayFile || href.replace('https://', '').replace(/\/$/, '')
      }

      const cursorPreview = document.getElementById('cursorPreview')
      const cursorPreviewFrame = document.getElementById('cursorPreviewFrame')
      const cursorPreviewImg = document.getElementById('cursorPreviewImg')
      let previewVisible = false

      document.addEventListener('mousemove', (event) => {
        cursorPreview.style.left = `${event.clientX + 24}px`
        cursorPreview.style.top = `${event.clientY - 60}px`
      })

      function showCursorPreview(src, thumbnail, title) {
        previewVisible = true
        cursorPreviewImg.style.display = thumbnail ? 'block' : 'none'
        cursorPreviewFrame.style.display = thumbnail ? 'none' : 'block'
        if (thumbnail) {
          cursorPreviewFrame.removeAttribute('src')
          delete cursorPreviewFrame.dataset.src
          cursorPreviewImg.src = thumbnail
          cursorPreviewImg.alt = title
          cursorPreview.style.opacity = '1'
          return
        }
        if (cursorPreviewFrame.dataset.src !== src) {
          cursorPreviewFrame.src = src
          cursorPreviewFrame.dataset.src = src
        }
        cursorPreview.style.opacity = '1'
      }

      function hideCursorPreview() {
        previewVisible = false
        cursorPreview.style.opacity = '0'
        window.setTimeout(() => {
          if (!previewVisible) {
            cursorPreviewFrame.src = ''
            delete cursorPreviewFrame.dataset.src
          }
        }, 240)
      }

      const compactLayout = () => window.innerWidth <= 768 || !matchMedia('(hover: hover)').matches
      const mobileRows = []
      let selectedMobileRow = null
      let mobileRequest = 0
      let mobileScrollFrame = 0
      function clearMobilePreview() {
        mobileRequest++
        selectedMobileRow = null
        document.querySelectorAll('.is-mobile-active').forEach(row => row.classList.remove('is-mobile-active'))
        document.body.classList.remove('mobile-preview-active')
        liquid?.hide()
      }
      async function updateMobilePreview() {
        if (!compactLayout() || document.body.classList.contains('profile-is-open')) return
        const area = document.getElementById('scrollArea')
        // Keep the first work reachable even when the list starts above mid-screen.
        const firstRect = mobileRows[0]?.row.getBoundingClientRect()
        const firstCenter = firstRect ? firstRect.top + area.scrollTop + firstRect.height / 2 : innerHeight * .55
        const focusY = Math.min(innerHeight * .55, firstCenter)
        const candidate = area.scrollTop > 1 ? mobileRows.find(item => {
          const rect = item.row.getBoundingClientRect()
          return rect.top <= focusY && rect.bottom > focusY
        }) : null
        if (!candidate) { if (selectedMobileRow) clearMobilePreview(); return }
        if (candidate.row === selectedMobileRow) return
        const request = ++mobileRequest
        selectedMobileRow = candidate.row
        const ready = await liquid?.show(candidate.image, candidate.row.getBoundingClientRect())
        if (request !== mobileRequest || !compactLayout()) return
        if (!ready) { clearMobilePreview(); return }
        document.querySelectorAll('.is-mobile-active').forEach(row => row.classList.remove('is-mobile-active'))
        candidate.row.classList.add('is-mobile-active')
        document.body.classList.add('mobile-preview-active')
      }
      function scheduleMobilePreview() {
        cancelAnimationFrame(mobileScrollFrame)
        mobileScrollFrame = requestAnimationFrame(updateMobilePreview)
      }

      let desktopLayoutMoving = false
      let desktopLayoutFrame = 0
      let desktopPointer = null
      let desktopInputDuringMotion = false
      document.addEventListener('mousemove', event => {
        desktopPointer = { x: event.clientX, y: event.clientY }
        if (desktopLayoutMoving) desktopInputDuringMotion = true
      })
      document.getElementById('scrollArea').addEventListener('wheel', event => {
        desktopPointer = { x: event.clientX, y: event.clientY }
        if (desktopLayoutMoving) desktopInputDuringMotion = true
      }, { passive: true })
      // Keep the chosen row under the pointer while the previous row contracts.
      // Layout-generated mouseenter/mouseleave events must not choose another row.
      function changeDesktopLayout(anchor, change) {
        cancelAnimationFrame(desktopLayoutFrame)
        desktopLayoutMoving = true
        desktopInputDuringMotion = false
        const area = document.getElementById('scrollArea')
        let top = anchor?.getBoundingClientRect().top
        let scroll = area.scrollTop
        const started = performance.now()
        change()
        const update = () => {
          if (anchor) {
            // Preserve real scrolling while compensating only for layout movement.
            top -= area.scrollTop - scroll
            area.scrollTop += anchor.getBoundingClientRect().top - top
            top = anchor.getBoundingClientRect().top
            scroll = area.scrollTop
            liquid?.setMask(anchor.getBoundingClientRect())
          }
          if (performance.now() - started < 460) {
            desktopLayoutFrame = requestAnimationFrame(update)
          } else {
            desktopLayoutMoving = false
            if (desktopInputDuringMotion && desktopPointer && !document.body.dataset.workHoverBlocked) {
              const next = document.elementFromPoint(desktopPointer.x, desktopPointer.y)?.closest('.work-row')
              if (next && !next.classList.contains('is-active')) next.startHover()
              else if (!next) clearDesktopHover()
            }
          }
        }
        desktopLayoutFrame = requestAnimationFrame(update)
      }

      function createRow(work) {
        const row = document.createElement('tr')
        const href = itemHref(work)
        const previewImage = work.image || work.thumbnail
        const hasImage = Boolean(previewImage)
        const adjustedColor = adjustColorForHover(work.color)
        const textColor = isLightColor(adjustedColor) ? '#1E1E21' : '#ffffff'
        const secondaryTextColor = isLightColor(adjustedColor) ? '#666666' : 'rgba(255, 255, 255, 0.8)'
        row.className = 'work-row'
        if (!hasImage) row.classList.add('normal-row')
        row.dataset.hasImage = String(hasImage)
        if (hasImage) mobileRows.push({ row, image: previewImage })
        row.dataset.tone = hasImage && isLightColor(adjustedColor) ? 'dark' : 'light'

        const thumbCell = document.createElement('td')
        const rowBg = document.createElement('div')
        rowBg.className = 'row-bg'
        rowBg.style.backgroundColor = adjustedColor
        const thumb = document.createElement('img')
        thumb.className = 'thumbnail'
        thumb.src = colorDot(adjustedColor)
        thumb.alt = work.title
        thumbCell.appendChild(rowBg)

        const year = document.createElement('td')
        year.className = 'year'
        year.textContent = work.year
        year.dataset.originalColor = '#999999'

        const type = document.createElement('td')
        type.className = 'type'
        type.textContent = work.type
        type.dataset.originalColor = '#999999'

        const title = document.createElement('td')
        title.className = 'title'
        title.textContent = work.title
        title.dataset.originalColor = '#1E1E21'

        const filename = document.createElement('td')
        filename.className = 'filename'
        filename.textContent = itemLabel(work)
        filename.dataset.originalColor = '#999999'

        const arrowCell = document.createElement('td')
        const arrow = document.createElement('span')
        arrow.className = 'arrow-icon'
        arrow.textContent = '（↗）'
        arrow.setAttribute('aria-hidden', 'true')
        arrow.dataset.originalColor = '#1E1E21'
        arrowCell.append(arrow, thumb)

        for (const cell of [year, type, title, filename]) {
          const clip = document.createElement('span')
          clip.className = 'row-entry-clip'
          const text = document.createElement('span')
          text.className = 'row-entry-text'
          text.textContent = cell.textContent
          clip.append(text)
          cell.replaceChildren(clip)
        }
        row.append(thumbCell, year, type, title, filename, arrowCell)

        const normalCells = [year, type, title, filename, arrow]

        function updateRowBgPosition() {
          const table = row.closest('table')
          if (!table) return
          const tableRect = table.getBoundingClientRect()
          const cellRect = thumbCell.getBoundingClientRect()
          rowBg.style.left = `${tableRect.left - cellRect.left}px`
          rowBg.style.width = `${tableRect.width}px`
        }

        window.setTimeout(updateRowBgPosition, 0)

        function setNormalHover(active) {
          normalCells.forEach((cell, index) => {
            const nextColor = active ? (index === 2 || index === 4 ? textColor : secondaryTextColor) : cell.dataset.originalColor
            cell.style.color = nextColor
          })
          arrow.style.opacity = active ? '1' : '0'
          arrow.style.transform = 'translateY(-50%)'
        }

        let hoverRequest = 0
        const startHover = async () => {
          if (compactLayout() || desktopLayoutMoving || document.body.dataset.workHoverBlocked) return
          if (!hasImage) {
            changeDesktopLayout(row, () => {
              document.querySelectorAll('.work-row.is-active').forEach(other => { if (other !== row) other.endHover() })
            })
            row.classList.add('is-active')
            animateTextShuffle(title)
            updateRowBgPosition()
            setNormalHover(true)
            if (window.matchMedia('(hover: hover)').matches) showCursorPreview(href, work.thumbnail, work.title)
            return
          }

          const request = ++hoverRequest
          row.setAttribute('aria-busy', 'true')
          await new Promise(resolve => setTimeout(resolve, 90))
          if (request !== hoverRequest || compactLayout() || document.body.dataset.workHoverBlocked) return
          const ready = await liquid?.show(previewImage, row.getBoundingClientRect())
          if (request !== hoverRequest || compactLayout() || document.body.dataset.workHoverBlocked) return
          row.removeAttribute('aria-busy')
          if (!ready) return
          changeDesktopLayout(row, () => {
            document.querySelectorAll('.work-row.is-active').forEach(other => { if (other !== row) other.endHover() })
            row.classList.add('is-active')
          })
          animateTextShuffle(title)
          if (hasImage) {
            const updateMask = () => liquid?.setMask(row.getBoundingClientRect())
            requestAnimationFrame(updateMask)
            window.setTimeout(updateMask, 120)
            window.setTimeout(updateMask, 320)
          } else {
            liquid?.hide()
          }
        }
        row.startHover = startHover
        row.addEventListener('mouseenter', startHover)
        row.addEventListener('mousemove', () => {
          if (compactLayout()) return
          if (hasImage) liquid?.setMask(row.getBoundingClientRect())
        })
        const endHover = () => {
          if (document.body.classList.contains('profile-is-open')) return
          hoverRequest++
          row.removeAttribute('aria-busy')
          if (!hasImage) {
            row.classList.remove('is-active')
            resetTextShuffle(title)
            setNormalHover(false)
            hideCursorPreview()
            return
          }

          row.classList.remove('is-active')
          resetTextShuffle(title)
          if (hasImage && !desktopLayoutMoving) liquid?.hide()
        }
        row.endHover = endHover
        row.addEventListener('mouseleave', event => {
          if (desktopLayoutMoving || document.body.dataset.workHoverBlocked) return
          if (event.relatedTarget instanceof Element && event.relatedTarget.closest('.profile-toggle,.profile-panel')) return
          // The next row owns the handoff; do not collapse before it is selected.
          const next = event.relatedTarget instanceof Element ? event.relatedTarget.closest('.work-row') : null
          if (next) {
            hoverRequest++
            row.removeAttribute('aria-busy')
            return
          }
          changeDesktopLayout(null, endHover)
          liquid?.hide()
        })
        row.addEventListener('click', () => {
          if (href.startsWith('http')) {
            window.open(href, '_blank')
          } else {
            window.location.href = href
          }
        })

        row.tabIndex = 0
        row.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); row.click() } })
        return row
      }

      function renderRows(id, items) {
        const body = document.getElementById(id)
        items.forEach((work) => body.appendChild(createRow(work)))
      }

      renderRows('clientWorksBody', clientWorks)
      renderRows('worksBody', works)

      {
        try {
          liquid = new LiquidHover(document.getElementById('gl'))
          window.liquid = liquid
        } catch (error) {
          console.warn('LiquidHover failed to initialize', error)
        }
      }

      document.querySelectorAll('.footer-links a, .versions-nav a, .versions-nav button').forEach((item) => {
        item.addEventListener('mouseenter', () => animateTextShuffle(item))
        item.addEventListener('mouseleave', () => resetTextShuffle(item))
      })

      const clearDesktopHover = () => {
        if (document.body.classList.contains('profile-is-open')) return
        cancelAnimationFrame(desktopLayoutFrame)
        desktopLayoutMoving = false
        desktopInputDuringMotion = false
        document.querySelectorAll('.work-row.is-active, .work-row[aria-busy="true"]').forEach(row => row.endHover())
        liquid?.hide()
      }
      const desktopScrollArea = document.getElementById('scrollArea')
      desktopScrollArea.addEventListener('scroll', () => {
        if (compactLayout()) { scheduleMobilePreview(); return }
        if (desktopScrollArea.scrollTop <= 1) { clearDesktopHover(); return }
        const row = document.querySelector('.work-row.is-active')
        if (!row || compactLayout()) return
        const rect = row.getBoundingClientRect()
        if (rect.bottom <= 0 || rect.top >= innerHeight) clearDesktopHover()
        else liquid?.setMask(rect)
      })
      // Reaching the scroll boundary may emit wheel input without a scroll event.
      desktopScrollArea.addEventListener('wheel', event => {
        if (event.deltaY < 0 && desktopScrollArea.scrollTop <= 1) clearDesktopHover()
      }, { passive: true })
      document.addEventListener('mousemove', event => {
        if (!(event.target instanceof Element)) return
        if (event.target.closest('.portfolio-intro') && !event.target.closest('.profile-toggle,.profile-panel')) clearDesktopHover()
      })
      window.addEventListener('resize', () => {
        clearMobilePreview()
        clearDesktopHover()
        scheduleMobilePreview()
      })
      scheduleMobilePreview()
      document.addEventListener('mouseleave', () => { if (!compactLayout()) clearDesktopHover() })
      window.addEventListener('blur', () => { if (!compactLayout()) clearDesktopHover() })
      document.querySelectorAll('.versions-nav, .footer-links, .app-icon-link').forEach(el => el.addEventListener('mouseenter', clearDesktopHover))
    </script>
